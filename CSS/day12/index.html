<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box1 {
            background-color: red;
            /* position: absolute;
            top: 0px;
            left: 10px; */
            position: sticky;
            top: 0px;
            height: 100%;
            margin: 0;
            padding: 0;


        }

        .box2 {
            background-color: blue;
            /* position: relative; */
            /* z-index: 1; */
        }

        .box3 {
            background-color: green;
            /* position: relative; */
            /* top: -20px;
            left: 20px; */
            position: fixed;
            bottom: 0;
            height: 111px;



        }

        .box4 {
            background-color: yellow;
        }

        .box {
            width: 80vw;
            height: 200px;
            margin: 4px;
            border: 2px solid black;
        }
        .parent {
            width: 90vw;
            margin: auto;
            border: 2px solid black;
            padding: 10px;
            /* position: absolute; */
            /* position:sticky; */
            /* filter: invert(0); */
            /* transform: translate(0); */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>

</body>

</html>
