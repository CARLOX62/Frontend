<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visibility Hidden Example</title>
  <style>
    .invisible-demo {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <h2>Visibility Hidden Example</h2>
  <p>This is visible text.</p>
  <p class="invisible-demo">This is invisible text (space remains).</p>
  <p>This is also visible.</p>
</body>
</html>
