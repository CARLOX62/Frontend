<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box {

            border: 2px solid navy;
            display: inline-block;
            padding: 50px;
            width: 200px;
            height: 200px;
            margin: 20px;
        }
        .box1 {
            border: 2px solid red;
            display: none;
            padding: 50px;
            width: 200px;
            height: 200px;
            margin: 20px;
        }
    </style>
</head>

<body>
    <div class="box1">
        i am a box
    </div>
    <div class="box">also a</div>
    <span>
        i am a 
    </span>
    <span>
        span
    </span>
</body>

</html>
