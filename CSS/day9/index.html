<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 20px;
            box-shadow: 5px 5px 15px 5px #0704b4;

        }

        .textshadow {
            text-shadow: 2px 2px 5px red;
        }

        body {
            
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f9f9f9;
        }

        .button:focus {
            outline: 2px solid blue;
        }

        .box {
            width: 160px;
            height: 80px;
            background: lightcoral;
            outline: 3px dashed black;
            outline-offset: 5px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="box">I am a aniket</div>
    <p class="textshadow"> Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <h2>Outline Example</h2>

    <button class="button">Click or Tab Me</button>
    <div class="box">Box with Outline</div>
</body>

</html>
