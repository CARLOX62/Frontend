<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX4</title>
    <style>
        :root{
            --primary-color: rgb(74, 12, 132);
            --text-color: white;
            --secondary-color:rgb(246, 218, 218);

        }
        body{
            background-color: var(--secondary-color);
        }
        *{
            margin: 0;
            padding: 0;
        }
        nav{
            background-color: var(--primary-color);
            padding: 12px 0;
        }
        ul li {
            list-style: none;
            display: inline;
            padding: 11px;
            font-weight: bolder;
            color:var(--text-color);
        }
        ul li a{
            text-decoration: none;
            color: var(--text-color);

        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact US</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
