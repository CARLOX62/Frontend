<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .container {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .childContainer {
            width: 200px;
            height: 200px;
            background-color: lightgreen;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .child {
            width: 100px;
            height: 100px;
            background-color: coral;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <span class="childContainer">
            <div class="child">
                Click Me
            </div>
        </span>
    </div>
    <script>
        document.querySelector('.child').addEventListener('click', function (e) {
            e.stopPropagation();
            alert('child Clicked');
        });
        document.querySelector('.childContainer').addEventListener("click", function (e) {
            e.stopPropagation();
            alert('Child Container Clicked');
        });
        document.querySelector('.container').addEventListener('click', function (e) {
            e.stopPropagation();
            alert('Parent Container Clicked');
        });


        setInterval(() => {
            console.clear();
            console.log('Event Bubbling Enabled');
            // # Random Color
            const randomColor = Math.floor(Math.random() * 16777215).toString(16);
            document.querySelector('.child').style.backgroundColor = `#${randomColor}`;
        }, 2000);


        setTimeout(() => {
            alert('Event Bubbling Demonstration: Click on the Coral Box');
        }, 1000);
    </script>
</body>

</html>
